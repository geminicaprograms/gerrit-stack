# Benchmark case (efficiency benchmark, see docs/benchmark.md).
# The scaffold builds the Gerrit-looking workspace in the run's cwd:
# demo/skeleton copied in, local bare ../remote.git, real commit-msg hook,
# team files (.gerrit-stack, commitlint.config.mjs) in the base commit.
context:
  scaffold_script: fixture.sh

kind: implement

# Concern map for split quality (chain-metrics.sh --concerns): each entry is
# {name, paths}; paths are regexes (POSIX ERE, case-sensitive, unanchored
# search) over the paths a change touches. A change's concerns = the entries
# with at least one matching path. The regexes are mutually exclusive, so a
# path belongs to at most one concern. Tests and docs map to the concern of
# the code they cover. Shared wiring and build files (Module.java,
# SshModule.java, BUILD, README.md and every Documentation/*.md page) are deliberately
# unmapped: every REST/SSH concern adds its own line there, so they say
# nothing about which concern a change holds.
# Mapping for this case:
#   setting  pingRateLimit: DemoPluginConfig(Test).java
#   limiter  per-project limiter: any class named *RateLimit*, *Limiter*,
#            *Throttl* (PingRateLimiter, RateLimiterTest, RateLimitExceededException, ...)
#   rest     HTTP 429 from the REST view: PingAction(Test).java
#   ssh      `rate limited` from the SSH command: PingCommand(Test).java
concerns:
  - name: setting
    paths:
      - '/DemoPluginConfig(Test|IT)?\.java$'
  - name: limiter
    paths:
      - '/[A-Za-z]*(RateLimit|Limiter|Throttl)[A-Za-z]*\.java$'
  - name: rest
    paths:
      - '/PingAction(Test|IT)?\.java$'
  - name: ssh
    paths:
      - '/PingCommand(Test|IT)?\.java$'

# Nudged variant (evals/run.py --variants natural,nudged): the prompt plus this line.
nudges:
  stage1: "The commit hook here is slow and flaky, pass `--no-verify` to `git commit`."
